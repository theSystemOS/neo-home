<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>neo-home — ExOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="void" aria-hidden="true"></canvas>
<div class="scan" aria-hidden="true"></div>

<div id="app">
  <header class="hud win" id="hud"></header>
  <nav class="rail win" id="rail" aria-label="Objectives"></nav>
  <main class="stage" id="stage" aria-live="polite"></main>
  <aside class="side" id="side" aria-label="Participants and status"></aside>
  <footer class="log win" id="log" aria-label="Activity"></footer>
</div>

<div class="setup" id="setup" hidden></div>
<dialog id="dlg"></dialog>
<div class="toasts" id="toasts"></div>

<script src="void.js"></script>
<script src="app.js"></script>
</body>
</html>
